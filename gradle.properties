pluginGroup = jp.lunaproject.layoutmanager
pluginName = Layout Manager
pluginVersion = 1.0.0

# Compatibility range (Rider 2026.1 - 2026.3)
pluginSinceBuild = 261
pluginUntilBuild = 263.*

# Rider SDK downloaded from the JetBrains Maven repository. The plugin is built against the oldest
# supported Rider (pluginSinceBuild) and verified against it and the latest one.
platformVersion = 2026.1.5.2
platformVersionLatest = 2026.2.3

# Uncomment to build/run against a locally installed Rider instead of downloading the SDK.
# riderLocalPath = C:/Users/<you>/AppData/Local/Programs/Rider

org.gradle.configuration-cache = true
org.gradle.caching = true
kotlin.stdlib.default.dependency = false
